name: Build and release Windows executable

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag, for example v1.0.0
        required: true
        default: v1.0.0
        type: string
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Embed application version
        shell: pwsh
        env:
          REQUESTED_TAG: ${{ inputs.release_tag }}
        run: |
          $releaseTag = ""
          if ($env:GITHUB_EVENT_NAME -eq "workflow_dispatch") {
            $releaseTag = $env:REQUESTED_TAG
          } elseif ($env:GITHUB_REF -like "refs/tags/*") {
            $releaseTag = $env:GITHUB_REF_NAME
          }

          if ($releaseTag) {
            if ($releaseTag -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?$') {
              throw "Release tag must use semantic versioning, for example v1.2.0."
            }
            $appVersion = $releaseTag.Substring(1)
            "RELEASE_TAG=$releaseTag" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          } else {
            $shortSha = $env:GITHUB_SHA.Substring(0, 8)
            $appVersion = "0.0.0-dev+$shortSha"
          }

          "APP_VERSION = `"$appVersion`"" | Set-Content "dashboard/_build_version.py" -Encoding utf8
          "Building Facilities Dashboard version $appVersion"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip
          cache-dependency-path: dashboard/requirements.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r dashboard/requirements.txt pyinstaller pillow

      - name: Download pinned Windows local AI runtime
        shell: pwsh
        env:
          LLAMA_RUNTIME_URL: https://github.com/ggml-org/llama.cpp/releases/download/b11429/llama-b11429-bin-win-cpu-x64.zip
          LLAMA_RUNTIME_SHA256: 1283323272b04cd07905816a597a0da810918102de958f4ff6f7bbaa70ed2efe
        run: |
          $archive = "build/llama-runtime.zip"
          $extractDirectory = "build/llama-runtime-extracted"
          $bundleDirectory = "build/llama-runtime-bundle"
          New-Item -ItemType Directory -Force "build" | Out-Null
          Invoke-WebRequest -Uri $env:LLAMA_RUNTIME_URL -OutFile $archive
          $actualHash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $env:LLAMA_RUNTIME_SHA256) {
            throw "The llama.cpp runtime checksum did not match the pinned release."
          }
          Expand-Archive -Path $archive -DestinationPath $extractDirectory -Force
          $server = Get-ChildItem $extractDirectory -Recurse -Filter "llama-server.exe" | Select-Object -First 1
          if (-not $server) {
            throw "The pinned llama.cpp archive does not contain llama-server.exe."
          }
          New-Item -ItemType Directory -Force $bundleDirectory | Out-Null
          Copy-Item -Path (Join-Path $server.Directory.FullName "*") -Destination $bundleDirectory -Recurse -Force
          & "$bundleDirectory/llama-server.exe" --version

      - name: Run updater tests
        shell: pwsh
        run: python -m unittest discover -s tests -v

      - name: Prepare Windows application icon
        shell: pwsh
        run: |
          python -c "from PIL import Image, ImageOps; image = Image.open('dashboard/static/app-icon.png').convert('RGBA'); square = ImageOps.pad(image, (512, 512), color=(4, 43, 66, 255)); square.save('dashboard/static/app-icon.ico', sizes=[(16,16),(32,32),(48,48),(64,64),(128,128),(256,256)])"

      - name: Build single-file executable
        shell: pwsh
        run: |
          python -m PyInstaller `
            --noconfirm `
            --clean `
            --onefile `
            --windowed `
            --name facilities_dashboard `
            --paths dashboard `
            --add-data "dashboard/static;static" `
            --icon "dashboard/static/app-icon.ico" `
            --collect-data webview `
            --collect-all keyring `
            --collect-all openai `
            --add-binary "build/llama-runtime-bundle/llama-server.exe;bin" `
            --add-binary "build/llama-runtime-bundle/*.dll;bin" `
            --hidden-import webview.platforms.qt `
            dashboard/desktop_app.py

      - name: Create SHA-256 checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash "dist/facilities_dashboard.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  facilities_dashboard.exe" | Out-File "dist/facilities_dashboard.exe.sha256" -Encoding ascii

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: facilities_dashboard-windows
          path: |
            dist/facilities_dashboard.exe
            dist/facilities_dashboard.exe.sha256
          if-no-files-found: error
          # GitHub Releases keeps the downloadable EXE for tagged builds.
          # This short-lived duplicate is only for immediate workflow debugging.
          retention-days: 1

      - name: Publish executable to GitHub Releases
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$env:RELEASE_TAG" --repo "$env:GITHUB_REPOSITORY" *> $null
          if ($LASTEXITCODE -eq 0) {
            throw "Release $env:RELEASE_TAG already exists. Publish upgrades with a new semantic version tag."
          }
          gh release create "$env:RELEASE_TAG" `
            "dist/facilities_dashboard.exe" `
            "dist/facilities_dashboard.exe.sha256" `
            --target "$env:GITHUB_SHA" `
            --title "Facilities Dashboard $env:RELEASE_TAG" `
            --generate-notes `
            --repo "$env:GITHUB_REPOSITORY"
